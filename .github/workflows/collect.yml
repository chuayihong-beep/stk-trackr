name: Collect news

# Brief §4 schedule. Cron is UTC; MYT = UTC+8.
# GitHub may start scheduled runs late at busy times; collection is idempotent, so late or skipped runs are safe.
on:
  # Schedule paused on 2026-11-09 (owner request). Restore by uncommenting.
  # PAUSED schedule:
  # PAUSED   - cron: '*/10 1-8 * * *'      # 09:00–16:50 MYT, every 10 minutes (48 runs)
  # PAUSED   - cron: '0,30 0,9-23 * * *'   # 17:00–08:30 MYT, every 30 minutes (32 runs)
  workflow_dispatch:

concurrency:
  group: collector
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: collector
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: collector/requirements.txt
      - run: pip install -r requirements.txt
      # Logs are public in this repo: the collector prints counts only, never names or headlines.
      - run: python -m stk_collector
        env:
          SUPABASE_URL: https://vewqmxhweysgtkieahij.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          NEWS_EDITION: en-MY
