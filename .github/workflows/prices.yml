name: Collect prices

# Weekdays 09:15, 11:15, 13:15, 15:15, 17:15 MYT (UTC+8). Nothing overnight or at weekends.
# Twelve Data serves covered listings every run; EODHD serves the rest once, at the 17:15 run.
on:
  schedule:
    - cron: '15 1,3,5,7,9 * * 1-5'
  workflow_dispatch:
    inputs:
      force_eodhd:
        description: 'Also fetch EODHD listings now (normally only after 17:00 MYT)'
        type: boolean
        default: false
      recheck_unsupported:
        description: 'Re-check listings marked unsupported (normally weekly)'
        type: boolean
        default: false

concurrency:
  group: prices
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: collector
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: collector/requirements.txt
      - run: pip install -r requirements.txt
      # Logs are public: the job prints counts only, never symbols, names or keys.
      - run: python -m stk_collector prices
        env:
          SUPABASE_URL: https://vewqmxhweysgtkieahij.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
          FORCE_EODHD: ${{ inputs.force_eodhd || 'false' }}
          RECHECK_UNSUPPORTED: ${{ inputs.recheck_unsupported || 'false' }}
